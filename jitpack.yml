jdk:
  - openjdk21

before_install:
  - git config --global --add safe.directory /build
  - for attempt in 1 2 3 4; do if sdk install java 21.0.11-tem && test -x "$HOME/.sdkman/candidates/java/21.0.11-tem/bin/java"; then break; fi; if [ "$attempt" -eq 4 ]; then exit 1; fi; sleep 5; done
  - sdk use java 21.0.11-tem

install:
  - for attempt in 1 2 3 4; do if ./mvnw -v; then break; fi; if [ "$attempt" -eq 4 ]; then exit 1; fi; sleep 5; done
  - ./mvnw -B install -DskipTests
