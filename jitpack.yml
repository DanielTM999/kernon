jdk:
  - openjdk21

before_install:
  - sdk update || true
  - sdk install java 21-open
  - sdk use java 21-open
  - sdk install maven 3.9.9 || sdk install maven 3.9.9 || true
  - sdk use maven 3.9.9 || true
  - git config --global --add safe.directory /build

install:
  - MVN="$HOME/.sdkman/candidates/maven/current/bin/mvn"; [ -x "$MVN" ] || MVN="$(command -v mvn)"; "$MVN" -v; "$MVN" -B install -DskipTests
